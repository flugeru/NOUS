---
name: NOUS Desktop (Windows)
permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:

concurrency:
  group: fork-test-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: github.repository == 'flugeru/NOUS' && !contains(github.event.head_commit.message, '[skip desktop]')
    uses: ./.github/workflows/ci-windows.yml
    with:
      release_commit: ${{ github.sha }}
      release_version: '1.0.0'
      symbol_product_name: NOUS
      symbol_release_prefix: nous
      build_tests: true
      require_signpath_signing: false
      require_truehdr_runtime: false
      release_artifact_retention_days: 7

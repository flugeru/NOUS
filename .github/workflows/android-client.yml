name: Android Client

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''
  push:
    branches: [master, NOUS-First-steps]
    paths: ['android/**']

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Initialize Android native dependencies
        working-directory: .
        run: git submodule update --init --recursive -- android/app/src/main/jni/moonlight-core/moonlight-common-c
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and NDK
        run: sdkmanager 'platforms;android-36' 'ndk;27.0.12077973'
      - name: Run unit tests and build the debug client
        run: bash ./gradlew --no-daemon :app:testNonRoot_gameDebugUnitTest :app:assembleNonRoot_gameDebug
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Artemis-Android-debug
          path: android/app/build/outputs/apk/nonRoot_game/debug/*.apk
          if-no-files-found: error

name: NOUS Android

on:
  workflow_dispatch:
  push:
    branches: [master, NOUS-First-steps]
    paths: ['android/**', '.github/workflows/android-client.yml']

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Initialize Android native dependencies
        working-directory: .
        run: git submodule update --init --recursive -- android/app/src/main/jni/moonlight-core/moonlight-common-c
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and NDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "ndk;27.0.12077973"'
      - name: Build the debug client
        run: bash ./gradlew --no-daemon :app:assembleNonRoot_gameDebug
      - name: Name the ARM64 APK for distribution
        run: |
          mkdir -p build/delivery
          cp app/build/outputs/apk/nonRoot_game/debug/*arm64-v8a*.apk build/delivery/NOUS-Android-arm64-debug.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: NOUS-Android-arm64-debug
          path: android/build/delivery/NOUS-Android-arm64-debug.apk
          if-no-files-found: error
      - name: Run Android unit tests
        run: bash ./gradlew --no-daemon :app:testNonRoot_gameDebugUnitTest

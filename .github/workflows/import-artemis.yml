name: Import Artemis source

on:
  push:
    branches: [NOUS-First-steps]
    paths: ['.github/workflows/import-artemis.yml']

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.import.outputs.revision }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: NOUS-First-steps
      - name: Import pinned source into the Android directory
        id: import
        shell: bash
        run: |
          if git ls-files --error-unmatch android/settings.gradle >/dev/null 2>&1; then
            echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          upstream=c5cf27f4dc822db0e863c4691e7a70c74bea977a
          git fetch --no-tags --depth=1 https://github.com/ClassicOldSong/moonlight-android.git "$upstream"
          test "$(git rev-parse FETCH_HEAD)" = "$upstream"
          git read-tree --prefix=android/ -u FETCH_HEAD
          module=app/src/main/jni/moonlight-core/moonlight-common-c
          url=$(git config -f android/.gitmodules --get "submodule.$module.url")
          git config -f .gitmodules "submodule.android/$module.path" "android/$module"
          git config -f .gitmodules "submodule.android/$module.url" "$url"
          git rm -f -- android/.gitmodules
          git apply --directory=android docs/latency/artemis-test.patch
          git add .gitmodules android/app/build.gradle android/gradle/wrapper/gradle-wrapper.properties
          git diff --cached --check -- .gitmodules
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Import Artemis Android source at c5cf27f'
          git push origin HEAD:refs/heads/NOUS-First-steps
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  android:
    needs: import
    uses: ./.github/workflows/android-client.yml
    with:
      source_ref: ${{ needs.import.outputs.revision }}

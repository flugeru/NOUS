apply plugin: 'com.android.application'

// Public Firebase client settings only. No provider or server credentials in the APK.
def firebaseConfig = file('google-services.json')
def firebaseJson = firebaseConfig.isFile() ? new groovy.json.JsonSlurper().parse(firebaseConfig) : [:]
def firebaseClient = firebaseJson.client?.find { it.client_info?.android_client_info?.package_name == 'com.flugel.nous' }
def firebaseWebClient = firebaseClient?.oauth_client?.find { it.client_type == 3 }?.client_id

if (providers.environmentVariable('GITHUB_ACTIONS').orNull == 'true') {
    def sdkDirectory = layout.buildDirectory.dir('robolectric-sdks')
    def prepareSdks = tasks.register('prepareRobolectricSdks', Sync) {
        // The tests use API 33. Robolectric 4.16 on CI's JDK 17 uses API 35
        // for compile-time resources.
        ['13-robolectric-9030017-i7', '15-robolectric-13954326-i7'].each { version ->
            from(configurations.detachedConfiguration(
                    dependencies.create("org.robolectric:android-all-instrumented:${version}@jar")))
        }
        into(sdkDirectory)
    }
    tasks.withType(Test).configureEach {
        dependsOn(prepareSdks)
        systemProperty 'robolectric.dependency.dir', sdkDirectory.get().asFile.absolutePath
    }
}

android {
    ndkVersion "27.0.12077973"

    compileSdk = 36

    namespace 'com.limelight'

    defaultConfig {
        minSdk 24
        // JSON escaping makes client config values safe as generated Java literals.
        buildConfigField 'String', 'FIREBASE_APP_ID', groovy.json.JsonOutput.toJson(firebaseClient?.client_info?.mobilesdk_app_id ?: '')
        buildConfigField 'String', 'FIREBASE_API_KEY', groovy.json.JsonOutput.toJson(firebaseClient?.api_key?.find { it.current_key }?.current_key ?: '')
        buildConfigField 'String', 'FIREBASE_PROJECT_ID', groovy.json.JsonOutput.toJson(firebaseJson.project_info?.project_id ?: '')
        buildConfigField 'String', 'FIREBASE_WEB_CLIENT_ID', groovy.json.JsonOutput.toJson(firebaseWebClient ?: '')
        targetSdk 36
        resourceConfigurations += ['en', 'pt-rBR']

        versionName "1.0.0"
        versionCode = 65

        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'
    }

    flavorDimensions.add("root")

    buildFeatures {
        buildConfig = true
    }

    productFlavors {
        root {
            // Android O has native mouse capture, so don't show the rooted
            // version to devices running O on the Play Store.
            maxSdk 25

            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=root"
                }
            }

            applicationId "com.flugel.nous.root"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "true"
        }

        nonRoot_game {
            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=nonRoot"
                }
            }

            applicationId "com.flugel.nous"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "false"
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        disable 'MissingTranslation'
        lintConfig file('lint.xml')
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    packaging {
        resources {
            pickFirsts.add('META-INF/versions/9/OSGI-INF/MANIFEST.MF')
        }
    }

    buildTypes {
        debug {
            resValue "string", "app_label", "NOUS"
            resValue "string", "app_label_root", "NOUS"
            resValue "string", "app_label_game", "NOUS"

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            resValue "string", "app_label", "NOUS"
            resValue "string", "app_label_root", "NOUS"
            resValue "string", "app_label_game", "NOUS"

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    splits {
        abi {
            enable true
            reset()
            include(providers.gradleProperty("nousEmulator").isPresent() ? "x86_64" : "arm64-v8a")
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.81'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.81'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'org.jmdns:jmdns:3.6.2'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'com.google.firebase:firebase-auth:25.0.0'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.github.ByteHamster:SearchPreference:v2.5.1'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.google.ai.edge.litert:litert:1.4.0'
    implementation 'com.google.ai.edge.litert:litert-gpu:1.4.0'
    implementation 'org.opencv:opencv:4.12.0'

    // Unit test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'org.mockito:mockito-core:5.19.0'
}
